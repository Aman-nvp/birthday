<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Countdown 💖</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
    }

    .card {
        width: 90%;
        max-width: 350px;
        background: white;
        border-radius: 20px;
        padding: 25px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        animation: fadeIn 1.5s ease;
    }

    h1 {
        color: #ff4081;
        margin-bottom: 5px;
    }

    h2 {
        font-size: 18px;
        color: #555;
    }

    /* PHOTO SLIDER */
    .slider {
        width: 220px;
        height: 220px;
        margin: 15px auto;
        border-radius: 15px;
        overflow: hidden;
        border: 4px solid #ff4081;
        box-shadow: 0 0 20px rgba(255,64,129,0.6);
        background-color: #fff;
        position: relative; /* container relative for absolute slides */
    }

    .slide {
        width: 100%;
        height: 100%;
        object-fit: contain; /* show full photo */
        position: absolute; /* stack slides on top of each other */
        top: 0;
        left: 0;
        opacity: 0;
        transition: opacity 1s ease-in-out;
        background-color: #fff;
    }

    .slide.active {
        opacity: 1;
    }

    .countdown {
        margin-top: 15px;
        font-size: 20px;
        font-weight: bold;
        color: #333;
    }

    .heart {
        font-size: 28px;
        margin-top: 10px;
        animation: heartbeat 1.2s infinite;
    }

    .message {
        margin-top: 10px;
        font-size: 15px;
        color: #ff4081;
    }

    @keyframes heartbeat {
        0% { transform: scale(1); }
        50% { transform: scale(1.3); }
        100% { transform: scale(1); }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media(max-width: 400px){
        .slider {
            width: 180px;
            height: 180px;
        }
    }
</style>
</head>

<body>

<div class="card">
    <h1>🎂 Birthday Countdown</h1>
    <h2>For My Love ❤️</h2>

    <!-- PHOTO SLIDER -->
    <div class="slider">
        <img src="photo1.jpg" class="slide active" alt="Birthday Photo 1">
        <img src="photo2.jpg" class="slide" alt="Birthday Photo 2">
        <!-- add more photos if needed -->
    </div>

    <div class="countdown" id="countdown"></div>

    <div class="heart">❤️</div>

    <div class="message">
        Counting every second for your smile 💕
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    /* PHOTO SLIDER JS */
    let index = 0;
    const slides = document.querySelectorAll(".slide");

    function nextSlide() {
        slides.forEach(slide => slide.classList.remove("active"));
        index = (index + 1) % slides.length;
        slides[index].classList.add("active");
    }

    if (slides.length > 0) {
        let sliderInterval = setInterval(nextSlide, 3000);

        // Pause slider on hover
        document.querySelector(".slider").addEventListener("mouseenter", () => {
            clearInterval(sliderInterval);
        });

        document.querySelector(".slider").addEventListener("mouseleave", () => {
            sliderInterval = setInterval(nextSlide, 3000);
        });
    }

    /* BIRTHDAY COUNTDOWN */
    function getNextBirthday() {
        const now = new Date();
        let birthday = new Date(now.getFullYear(), 4, 21); // 21 May
        if (now > birthday) {
            birthday = new Date(now.getFullYear() + 1, 4, 21);
        }
        return birthday;
    }

    function updateCountdown() {
        const now = new Date();
        const birthday = getNextBirthday();
        const diff = birthday - now;

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById("countdown").innerHTML =
            `${days}d ${hours}h ${minutes}m ${seconds}s 💖`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
});
</script>

</body>
</html>
